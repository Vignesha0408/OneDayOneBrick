<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Enter a:</h1><input id="a" type="number">
    <h2>Enter b:</h2><input id="b" type="number"><br><br>
    <button onclick="add()" style="height:50px;width:100px;" >click me</button><br><br>
    <h2 id="sum"></h2>
    <script>

    function add()
    {
        var a=Number(document.getElementById("a").value);
        var b=Number(document.getElementById("b").value);
        document.getElementById("sum").innerHTML=a+b;
       // window.alert(`${a} + ${b} = ${a+b}`);
    }
    
    </script>
</body>
</html>
