<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <style>
        body{
             display: flex;
                align-items:center;
                flex-direction:column;
                
        }
.tray{
    border-radius:10%;
    margin:50px;
    background-color: Black;
    display: flex;
    justify-content: center;
    align-items:center;
    flex-direction:column;
    width:300px;
    height:700px;
}
.red_c{
    margin:12px;
    background-color: red;
    width:200px;
    height:200px;
    border-radius:50%;
}
.yellow_c{
    margin:12px;
    background-color: yellow;
    width:200px;
    height:200px;
    border-radius:50%;
}
.green_c{
    margin:12px;
    background-color: green;
    width:200px;
    height:200px;
    border-radius:50%;
}

    </style>
</head>
<body>
    <div class="tray">
        <div class="red_c">
            
        </div>
        <div class="yellow_c">
            
        </div>
        <div class="green_c">
            
        </div>
    </div>
</body>
</html>
